<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>移転しました | Village Aura</title>
<script>
// 旧サービスワーカーとキャッシュを破棄してから新URLへ
(async function(){
  try{
    if('serviceWorker' in navigator){
      const rs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(rs.map(r=>r.unregister()));
    }
    if(window.caches){
      const ks=await caches.keys();
      await Promise.all(ks.map(k=>caches.delete(k)));
    }
  }catch(e){}
  location.replace('https://village-aura.inadaiin.com/');
})();
</script>
<style>
  body{font-family:-apple-system,'Hiragino Kaku Gothic ProN',sans-serif;background:#091929;color:#fff;
       display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:24px;text-align:center}
  a{color:#7bafd4}
</style>
</head>
<body>
  <div>
    <div style="font-size:52px;margin-bottom:16px">🔄</div>
    <h1 style="font-size:19px;margin:0 0 12px">アクセス先が変更されました</h1>
    <p style="font-size:14px;color:rgba(255,255,255,.7);line-height:1.8;margin:0 0 18px">
      自動で新しいURLへ移動します。<br>移動しない場合は下のリンクを開いてください。
    </p>
    <p><a href="https://village-aura.inadaiin.com/">https://village-aura.inadaiin.com/</a></p>
    <p style="font-size:12px;color:rgba(255,255,255,.45);margin-top:20px">
      ホーム画面に追加している場合は、新URLで追加し直してください。
    </p>
  </div>
</body>
</html>
